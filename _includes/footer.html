<footer class="site-footer">
  <div class="container footer-row">
    <p class="footer-cta">Looking for a gameplay programmer? <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    <nav class="footer-links" aria-label="Contact">
      <a href="{{ site.linkedin }}">LinkedIn</a>

      <a href="{{ site.cv_file | relative_url }}">CV</a>
    </nav>
  </div>
</footer>
